<!doctype html>
<html>
	<head>
		<title>Uma's Library</title>
	</head>
	<body>
		<h1 id="header">Library Books</h1>
		<p id="status">Loading books...</p>
		<ul id="books"></ul>
		
		<script type="module">
			const status = document.querySelector("#status");
			const list = document.querySelector("#books");
			const response = await fetch("http://localhost:3000/books");

			async function loadBooks() {
				try {
					if (!response.ok) {
						throw new Error(`Request failed: ${response.status}`);
					}

					const books = await response.json();
					if (!Array.isArray(books)) {
						throw new Error("Expected /books to return a JSON array.");
					}

					status.textContent = books.length ? "" : "No books found.";

					for (const book of books) {
						const item = document.createElement("li");
						item.textContent = `${book.title ?? "Untitled"} - ${book.author_name ?? "Unknown author"}`;
						list.append(item);
					}
				} catch (error) {
					status.textContent = `Could not load books: ${error.message}`;
				}
			}

			loadBooks();
		</script>
	</body>
</html>
